<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>me193 nav</title>
<style>
  :root {
    --bg: #f4f4f2; --card: #ffffff; --ink: #141414; --muted: #5d5d58; --line: #deded9;
    --left: #2a6fd6; --right: #d9601f; --stairs: #7a4bc4; --arrived: #12925f;
    --rec: #d62e2e; --ok: #12925f; --warn: #c98a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --card: #1c1d20; --ink: #f2f2ef; --muted: #a2a29c; --line: #2e2f33;
      --left: #4a8cf0; --right: #f07a3a; --stairs: #9b6fe0; --arrived: #2bb37c;
      --rec: #f04848; --ok: #2bb37c; --warn: #e0a525;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  main { max-width: 560px; margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .mode { font-size: 13px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 99px; padding: 2px 9px; }
  header .link { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--rec); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .live { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .big { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1; }
  .big small { font-size: 20px; font-weight: 600; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .heading { display: flex; align-items: center; gap: 10px; }
  .arrow { width: 40px; height: 40px; flex: none; transition: transform .2s; }
  .stats { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px;
    padding-top: 10px; border-top: 1px solid var(--line); font-size: 15px; font-variant-numeric: tabular-nums; }
  .stats b { font-weight: 650; }
  .chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; color: #fff; background: var(--muted); }
  .chip.gyro { background: var(--warn); } .chip.cnn { background: var(--left); }

  .startstop { width: 100%; margin: 12px 0; padding: 18px; border: 0; border-radius: 14px;
    font-size: 22px; font-weight: 700; color: #fff; background: var(--ok); touch-action: manipulation; }
  .startstop.rec { background: var(--rec); }
  .startstop:disabled { opacity: .5; }
  .session { text-align: center; font-size: 14px; color: var(--muted); margin: -4px 0 10px; min-height: 18px;
    font-variant-numeric: tabular-nums; }

  .pad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ev { position: relative; height: min(22vh, 170px); min-height: 110px; border: 0; border-radius: 16px;
    font-size: 24px; font-weight: 800; letter-spacing: .04em; color: #fff; touch-action: manipulation;
    transition: transform .06s, filter .06s; user-select: none; -webkit-user-select: none; }
  .ev:active:not(:disabled) { transform: scale(.97); filter: brightness(1.15); }
  .ev:disabled { filter: grayscale(1); opacity: .35; }
  .ev.flash { filter: brightness(1.45); }
  .ev[data-b=LEFT] { background: var(--left); } .ev[data-b=RIGHT] { background: var(--right); }
  .ev[data-b=STAIRS] { background: var(--stairs); } .ev[data-b=ARRIVED] { background: var(--arrived); }
  .ev .n { position: absolute; top: 8px; right: 10px; font-size: 14px; font-weight: 700; opacity: .85; }

  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  .files { list-style: none; margin: 0; padding: 0; }
  .files li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size: 15px; font-variant-numeric: tabular-nums; }
  .files li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files a { color: var(--left); font-weight: 650; text-decoration: none; padding: 6px 4px; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>me193 nav</h1><span class="mode">Record</span>
    <span class="link"><span class="dot" id="dot"></span><span id="linktext">connecting…</span></span>
  </header>

  <section class="card live" aria-live="polite">
    <div>
      <div class="label">Distance</div>
      <div class="big" id="dist">–<small>m</small></div>
      <div class="sub">since turn <b id="since">–</b> m</div>
    </div>
    <div>
      <div class="label">Heading</div>
      <div class="heading">
        <div class="big" id="head">–<small>°</small></div>
        <svg class="arrow" id="arrow" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/>
          <path d="M20 5 L28 27 L20 22 L12 27 Z" fill="currentColor"/>
        </svg>
      </div>
      <div class="sub">+ = right of start</div>
    </div>
    <div class="stats">
      <span>Steps <b id="steps">–</b></span>
      <span>Turns <b id="turns">–</b></span>
      <span><span class="chip" id="det">–</span></span>
      <span class="sub">cnn <span id="cnn">–</span> · gyro <span id="gyro">–</span></span>
    </div>
  </section>

  <button class="startstop" id="startstop" disabled>Start</button>
  <div class="session" id="session"></div>

  <section class="pad">
    <button class="ev" data-b="LEFT" disabled>LEFT<span class="n"></span></button>
    <button class="ev" data-b="RIGHT" disabled>RIGHT<span class="n"></span></button>
    <button class="ev" data-b="STAIRS" disabled>STAIRS<span class="n"></span></button>
    <button class="ev" data-b="ARRIVED" disabled>ARRIVED<span class="n"></span></button>
  </section>

  <h2>Recordings</h2>
  <ul class="files" id="files"><li class="empty">–</li></ul>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let st = null, failures = 0, busy = false, counts = {};

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600);
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function fmtTime(s) {
  if (s == null) return "";
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return `${m}:${String(r).padStart(2, "0")}`;
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

function render() {
  const linked = failures === 0 && st;
  $("dot").className = "dot " + (!linked ? "bad" : st.sensor_ok ? "ok" : "");
  $("linktext").textContent = !linked ? "no connection" : st.sensor_ok ? "live" : "no sensor data";
  if (!st) return;
  $("dist").innerHTML = `${st.distance_m.toFixed(1)}<small>m</small>`;
  $("since").textContent = st.since_turn_m.toFixed(1);
  $("head").innerHTML = `${st.heading_deg > 0 ? "+" : ""}${Math.round(st.heading_deg)}<small>°</small>`;
  $("arrow").style.transform = `rotate(${st.heading_deg}deg)`;
  $("steps").textContent = st.steps;
  $("turns").textContent = st.turns + (st.last_turn ? ` (last ${st.last_turn})` : "");
  $("det").textContent = st.detector.toUpperCase();
  $("det").className = "chip " + st.detector;
  $("cnn").textContent = st.cnn_steps; $("gyro").textContent = st.gyro_steps;
  const ss = $("startstop");
  ss.disabled = busy || !linked;
  ss.textContent = st.recording ? "Stop" : "Start";
  ss.classList.toggle("rec", st.recording);
  $("session").textContent = st.recording ? `● ${st.session} · ${fmtTime(st.elapsed_s)}` : "";
  document.querySelectorAll(".ev").forEach((b) => {
    b.disabled = !st.recording || !linked;
    b.querySelector(".n").textContent = counts[b.dataset.b] || "";
  });
}

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const wasRec = st && st.recording;
    st = await r.json(); failures = 0;
    if (wasRec !== undefined && wasRec !== st.recording) loadFiles();
  } catch (e) { failures++; }
  render();
  setTimeout(poll, 250);
}

async function loadFiles() {
  try {
    const list = await (await fetch("/api/sessions", { cache: "no-store" })).json();
    const ul = $("files");
    ul.innerHTML = "";
    if (!list.length) { ul.innerHTML = '<li class="empty">No recordings yet.</li>'; return; }
    for (const s of list) {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.textContent = `${s.name}${s.recording ? " (recording)" : ""} · ${s.kb} KB`;
      li.append(name);
      const link = (file, text) => {
        const a = document.createElement("a");
        a.href = `/files/${encodeURIComponent(file)}`; a.textContent = text; a.download = file;
        li.append(a);
      };
      link(s.csv, "CSV");
      if (s.imu_csv) link(s.imu_csv, "IMU");
      if (!s.recording) link(`${s.name}.json`, "info");
      ul.append(li);
    }
  } catch (e) {}
}

$("startstop").addEventListener("click", async () => {
  if (!st || busy) return;
  if (st.recording && !confirm("Stop recording?")) return;
  busy = true; render();
  try {
    if (st.recording) {
      const j = await post("/api/stop");
      toast(`Saved ${j.session} (${j.rows} rows)`);
    } else {
      const j = await post("/api/start");
      counts = {};
      toast(`Recording ${j.session}`); buzz(60);
    }
    loadFiles();
  } catch (e) { toast(e.message); }
  busy = false;
});

document.querySelectorAll(".ev").forEach((b) => {
  b.addEventListener("click", async () => {
    const name = b.dataset.b;
    b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 180);
    buzz(40);
    try {
      await post("/api/event", { button: name });
      counts[name] = (counts[name] || 0) + 1;
      toast(name); render();
    } catch (e) { toast(`${name} not logged: ${e.message}`); buzz([80, 60, 80]); }
  });
});

poll();
loadFiles();
</script>
</body>
</html>
